<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NomNom Tracker</title>
<meta name="description" content="A calorie tracker built around Indian food: South and North Indian dishes, macros, water, activity, weight and an AI coach.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151F19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NomNom">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first food diary; on wide screens the thali summary, water and activity sit in a left column beside the meal log */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#E8EEE6;
  --plate:#E2E8E3; --plate-rim:#C9D3CC; --plate-well:#F6F8F6;
  --ink:#15211A; --ink-2:#44544A; --ink-3:#62716A; --line:#D9E2DA;
  --leaf:#1D6A46; --leaf-2:#2A8458; --leaf-ink:#FFFFFF; --leaf-soft:#DCEEE2;
  --turmeric:#B8780C; --turmeric-soft:#FAEBCD;
  --chili:#BF3A2C; --chili-soft:#F8DFDB;
  --protein:#2C6FA6; --carbs:#D08A12; --fat:#8C4A89; --water:#2F86C9;
  --veg:#178A3A; --nonveg:#8A3B17; --egg:#C98510;
  --shadow:0 1px 2px rgba(21,33,26,.06),0 10px 30px rgba(21,33,26,.08);
  --scrim:rgba(14,24,18,.45);
  --font-display:"Baloo 2","Mukta",ui-rounded,system-ui,sans-serif;
  --font-body:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#151F19; --surface-2:#1C2821;
  --plate:#202C25; --plate-rim:#2E3D34; --plate-well:#121A15;
  --ink:#E4ECE6; --ink-2:#AAB9AF; --ink-3:#86968C; --line:#27352C;
  --leaf:#4DB37F; --leaf-2:#6CC898; --leaf-ink:#06140C; --leaf-soft:#183427;
  --turmeric:#E8AE47; --turmeric-soft:#382C13;
  --chili:#EE6B5E; --chili-soft:#3B1D19;
  --protein:#6BAAE0; --carbs:#E8AE47; --fat:#C98CC5; --water:#62B2EE;
  --veg:#3FBF66; --nonveg:#D9774A; --egg:#E8AE47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#151F19; --surface-2:#1C2821;
  --plate:#202C25; --plate-rim:#2E3D34; --plate-well:#121A15;
  --ink:#E4ECE6; --ink-2:#AAB9AF; --ink-3:#86968C; --line:#27352C;
  --leaf:#4DB37F; --leaf-2:#6CC898; --leaf-ink:#06140C; --leaf-soft:#183427;
  --turmeric:#E8AE47; --turmeric-soft:#382C13;
  --chili:#EE6B5E; --chili-soft:#3B1D19;
  --protein:#6BAAE0; --carbs:#E8AE47; --fat:#C98CC5; --water:#62B2EE;
  --veg:#3FBF66; --nonveg:#D9774A; --egg:#E8AE47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%;color:var(--ink)}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft)}
:focus-visible{outline:2.5px solid var(--leaf);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* top bar + navigation */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:34px;height:34px}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:25px;line-height:.9;letter-spacing:-.01em;display:block}
.brand-tag{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600;display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 4px;color:var(--ink-3);font-size:12px;font-weight:600;border-radius:12px;min-height:48px;justify-content:center}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--leaf)}
.head-add{display:none!important}
.fab{position:fixed;z-index:39;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--leaf);color:var(--leaf-ink);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab .ic{width:22px;height:22px}
@media (min-width:900px){
  .tabbar{position:static;background:none;border:0;padding:0;display:flex;gap:4px;margin-left:12px}
  .tab{flex-direction:row;gap:8px;font-size:15px;padding:8px 14px;border-radius:999px;min-height:40px}
  .tab .ic{width:19px;height:19px}
  .tab[aria-current="page"]{background:var(--leaf-soft)}
  .tab:hover{color:var(--ink)}
  .head-add{display:inline-flex!important;margin-left:auto}
  .head-add[hidden]{display:none!important}
  .fab{display:none}
}

/* shared controls */
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 160px}
@media (min-width:900px){.wrap{padding-block:18px 64px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid transparent;font-weight:600;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.btn.primary:hover{background:var(--leaf-2)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.danger{background:var(--chili);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--chili);border-color:var(--chili-soft)}
.btn.grow{flex:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--leaf);font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:transparent;border:1.5px solid var(--line);color:var(--ink-2);flex:none;padding:0}
.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.iconbtn.xs{width:30px;height:30px;border-color:transparent}
.iconbtn.xs .ic{width:16px;height:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on b{color:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{flex:1 1 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:600;color:var(--ink-2)}
.segbtn.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink)}
.field{display:grid;gap:6px}
.field>label,.field>.label{font-weight:600;font-size:14px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-3)}
.err{font-size:13.5px;color:var(--chili);font-weight:600}
.unit-input{display:flex;align-items:center;gap:8px}
.unit-input input{flex:1;min-width:0}
.unit-input span{color:var(--ink-3);font-size:14px;min-width:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-family:var(--font-display);font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.2}
.card-head h3 .ic{color:var(--ink-3)}
.card-head .right{margin-left:auto}
.view-title{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:14px}
.view-sub{color:var(--ink-3);margin-top:2px}
.fineprint{font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* veg / non-veg marks (FSSAI style) */
.vm{width:14px;height:14px;border:1.6px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.vm::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.vm.v{color:var(--veg)}
.vm.e{color:var(--egg)}
.vm.n{color:var(--nonveg)}
.vm.n::after{width:0;height:0;border-radius:0;background:none;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-bottom:6px solid currentColor}
.vm.u{color:var(--ink-3);border-style:dashed}
.vm.u::after{width:4px;height:4px}
.more-ways{display:flex;flex-direction:column;align-items:flex-start;gap:0;margin-top:10px}

/* loading */
.loading{display:grid;place-items:center;gap:12px;padding:80px 16px;text-align:center;color:var(--ink-3)}
.loading svg{width:56px;height:56px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* today */
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--turmeric-soft);border-radius:var(--r);padding:12px 16px;margin-top:10px}
.banner p{flex:1 1 220px;font-size:14.5px}
.banner b{font-weight:700}
.today{display:grid;gap:14px;margin-top:10px;grid-template-areas:"date" "plate" "meals" "water" "act"}
.a-date{grid-area:date}.a-plate{grid-area:plate}.a-meals{grid-area:meals}.a-water{grid-area:water}.a-act{grid-area:act}
@media (min-width:900px){
  .today{grid-template-columns:minmax(320px,380px) 1fr;grid-template-rows:auto auto auto auto 1fr;grid-template-areas:"date date" "plate meals" "water meals" "act meals" ". meals";column-gap:22px;align-items:start}
}
.datebar{display:grid;gap:10px}
.datebar-top{display:flex;align-items:flex-end;gap:10px}
.hello{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.day-title{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1}
.datebar-nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.wd{display:grid;justify-items:center;gap:1px;background:none;border:0;border-radius:12px;padding:6px 0 7px;color:var(--ink-2);min-height:56px}
.wd:hover:not(:disabled){background:var(--surface-2)}
.wd:disabled{opacity:.4;cursor:default}
.wd-name{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-3)}
.wd-num{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.wd-dot{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--line)}
.wd-dot.ok{background:var(--leaf);border-color:var(--leaf)}
.wd-dot.over{background:var(--chili);border-color:var(--chili)}
.wd.is-today .wd-name{color:var(--leaf)}
.wd.sel{background:var(--ink);color:var(--bg)}
.wd.sel .wd-name{color:inherit;opacity:.8}
.wd.sel .wd-dot{border-color:var(--bg)}
.wd.sel .wd-dot.ok,.wd.sel .wd-dot.over{border-color:var(--bg)}
.plate-card{padding:18px 16px 16px}
.plate-row{display:flex;align-items:center;gap:14px}
.thali{flex:0 1 210px;min-width:0;width:100%;height:auto;display:block}
.plate-rim{fill:var(--plate-rim)}
.plate{fill:var(--plate)}
.ring-track{fill:none;stroke:var(--plate-well);stroke-width:15}
.ring-fill{fill:none;stroke:var(--leaf);stroke-width:15;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.ring-over{fill:none;stroke:var(--chili);stroke-width:15;stroke-linecap:round}
.plate-well{fill:var(--plate-well)}
.thali-num{font-family:var(--font-display);font-weight:800;font-size:44px;fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.thali-num.over{fill:var(--chili)}
.thali-lbl{font-family:var(--font-body);font-size:14px;fill:var(--ink-2);text-anchor:middle;font-weight:600}
.thali-sub{font-family:var(--font-body);font-size:12px;fill:var(--ink-3);text-anchor:middle}
.trio{display:grid;gap:12px;margin:0;flex:1;min-width:0}
.trio div{display:grid}
.trio dt{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.trio dd{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.trio dd small{font-family:var(--font-body);font-size:12px;color:var(--ink-3);font-weight:500;margin-left:3px}
.katoris{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.katori{display:grid;justify-items:center;text-align:center;gap:1px}
.katori svg{width:58px;height:auto}
.katori.p{--k:var(--protein)}.katori.c{--k:var(--carbs)}.katori.f{--k:var(--fat)}
.k-bowl{fill:var(--plate-well);stroke:var(--plate-rim);stroke-width:2}
.k-fill{fill:var(--k);opacity:.9}
.k-rim{stroke:var(--plate-rim);stroke-width:3;stroke-linecap:round;fill:none}
.k-lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.k-val{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.k-val b{color:var(--ink);font-weight:700}
.k-val.over b{color:var(--chili)}
.fibre-line{font-size:13px;color:var(--ink-3);text-align:center;margin-top:8px}
.fibre-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.meals{display:grid;gap:12px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px;flex-wrap:wrap}
.meal-head h3{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.1}
.meal-time{color:var(--ink-3);font-size:13px}
.meal-kcal{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.meal-kcal small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.meal-bar{height:5px;background:var(--surface-2);margin:0 16px;border-radius:3px;overflow:hidden}
.meal-bar span{display:block;height:100%;background:var(--leaf);border-radius:3px;transition:width .5s ease}
.meal-bar span.over{background:var(--chili)}
.meal-rec{font-size:12.5px;color:var(--ink-3);padding:6px 16px 0}
.entries{list-style:none;margin:8px 0 0;padding:0}
.entry-btn{display:flex;width:100%;align-items:center;gap:12px;padding:10px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:var(--ink)}
.entry-btn:hover{background:var(--surface-2)}
.e-main{display:grid;min-width:0;flex:1}
.e-name{font-weight:600;overflow-wrap:anywhere}
.e-sub{font-size:13px;color:var(--ink-3)}
.e-kcal{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.e-kcal small{font-weight:500;color:var(--ink-3);font-size:12px}
.suggest{padding:10px 16px 2px}
.suggest p{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.meal-foot{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}
.entries+.meal-foot{border-top:1px solid var(--line)}
.side-card .card-head{margin-bottom:10px}
.glasses{display:flex;flex-wrap:wrap;gap:4px}
.glass{width:34px;height:44px;background:none;border:0;padding:2px;border-radius:8px}
.glass svg{width:100%;height:100%;display:block}
.g-bg{fill:var(--plate-well)}
.g-line{fill:none;stroke:var(--plate-rim);stroke-width:1.8;stroke-linejoin:round}
.g-water{fill:var(--water);opacity:0;transition:opacity .25s}
.glass.full .g-water{opacity:.9}
.glass:hover:not(.full) .g-water{opacity:.25}
.water-foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.water-foot .muted{margin-right:auto;font-size:13.5px}
.act-list{list-style:none;margin:0 0 10px;padding:0;display:grid}
.act-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.act-list li span:first-child{font-weight:600;flex:1;min-width:0}
.act-list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.side-card>p{margin-bottom:10px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .22s ease}
.sheet.tall{height:calc(100% - 20px - env(safe-area-inset-top,0px))}
@media (min-width:700px){
  .sheet-wrap{align-items:center;padding:32px}
  .sheet{border-radius:22px;max-height:min(780px,100%)}
  .sheet.tall{height:min(780px,100%)}
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.15;min-width:0}
.sheet-head h2 small{display:block;font-family:var(--font-body);font-size:13px;color:var(--ink-3);font-weight:500}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));flex:1;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.sheet-body>*{min-width:0}
.filters .chips{flex:1 1 100%;min-width:0}
.stabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:-4px 0 0}
.stabs::-webkit-scrollbar{display:none}
.stab{background:none;border:0;border-bottom:2.5px solid transparent;padding:8px 10px;font-weight:600;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;min-height:42px}
.stab .ic{width:16px;height:16px}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--leaf)}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.searchbox input{padding-left:40px;min-height:48px;font-size:16px;border-radius:14px}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.toggle input{width:18px;height:18px;min-height:0;accent-color:var(--leaf)}
.results{list-style:none;margin:0;padding:0;display:grid}
.res-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin:4px 0 2px}
.food-row{display:flex;width:100%;align-items:center;gap:12px;padding:11px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.food-row:hover{background:var(--surface-2)}
.fr-main{display:grid;flex:1;min-width:0}
.fr-name{font-weight:600}
.fr-sub{font-size:13px;color:var(--ink-3)}
.fr-kcal{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fr-kcal small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.empty{padding:22px 8px;text-align:center;color:var(--ink-3);display:grid;gap:10px;justify-items:center}
.d-head{display:flex;align-items:flex-start;gap:12px}
.d-head .vm{margin-top:7px}
.d-title{flex:1;min-width:0}
.d-title h3{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1}
.d-title p{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.fav.on{color:var(--turmeric);border-color:var(--turmeric-soft);background:var(--turmeric-soft)}
.fav.on .ic{fill:currentColor}
.qty-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qty-row input{width:90px;flex:none;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.qty-row select{flex:1 1 160px;min-width:0;width:auto}
.nut{background:var(--surface-2);border-radius:16px;padding:14px}
.nut-kcal{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nut-kcal b{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.nut-kcal span{margin-left:auto;font-size:13.5px;color:var(--ink-3)}
.nut-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nut-grid div{display:grid;border-left:3px solid var(--k,var(--line));padding-left:8px}
.nut-grid .p{--k:var(--protein)}.nut-grid .c{--k:var(--carbs)}.nut-grid .f{--k:var(--fat)}.nut-grid .fb{--k:var(--leaf)}
.nut-grid span{font-size:12px;color:var(--ink-3)}
.nut-grid b{font-variant-numeric:tabular-nums;font-size:15px}
.nut-g{font-size:13px;color:var(--ink-3);margin-top:10px}
.d-actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-top:6px}
.est-tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--turmeric);background:var(--turmeric-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.ai-box{display:grid;gap:10px}
.ai-photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ai-photo img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--leaf);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.rv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rv-item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.rv-item.off{opacity:.55}
.rv-item input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--leaf);flex:none}
.rv-main{flex:1;min-width:0;display:grid}
.rv-name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv-sub{font-size:13px;color:var(--ink-3)}
.rv-q{display:flex;align-items:center;gap:4px}
.rv-q b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.rv-total{display:flex;justify-content:space-between;font-weight:700;padding:4px 2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}

/* onboarding */
.ob-wrap{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto}
.ob{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-prog{display:flex;gap:6px;flex:1}
.ob-prog span{height:5px;flex:1;border-radius:3px;background:var(--line)}
.ob-prog span.on{background:var(--leaf)}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--leaf)}
.ob h1{font-family:var(--font-display);font-size:32px;line-height:1.08;font-weight:700;margin-top:4px}
.lede{color:var(--ink-2);font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.opt-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .opt-dot{border-color:var(--leaf)}
.opt.on .opt-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.opt b{display:block;font-weight:700}
.opt span.d{font-size:13.5px;color:var(--ink-3)}
.ob-nav{display:flex;gap:10px;margin-top:4px}
.big-kcal{font-family:var(--font-display);font-size:64px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;color:var(--leaf)}
.big-kcal span{font-size:22px;color:var(--ink-2);font-weight:600}
.macro-pills{display:flex;gap:8px;flex-wrap:wrap}
.mpill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 8px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.mpill i{width:10px;height:10px;border-radius:50%;background:var(--k)}
.mpill.p{--k:var(--protein)}.mpill.c{--k:var(--carbs)}.mpill.f{--k:var(--fat)}
.mpill b{font-variant-numeric:tabular-nums}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.facts li{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.facts li:last-child{border-bottom:0}
.facts li>span:first-child{color:var(--ink-3);font-size:13.5px;flex:1 1 140px}
.facts li b{font-variant-numeric:tabular-nums}
.math{font-size:14px;color:var(--ink-2)}
.math summary{cursor:pointer;font-weight:700;color:var(--leaf);padding:4px 0}
.math ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.math code{font-family:var(--font-body);font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;display:block}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.warn{background:var(--turmeric-soft);color:var(--turmeric)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}

/* insights */
.ins-grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){.ins-grid{grid-template-columns:1fr 1fr}.ins-grid .span2{grid-column:1/-1}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:grid}
.stat span{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat b{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{font-size:12.5px;color:var(--ink-3)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--font-body);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--leaf)}
.chart .bar.over{fill:var(--chili)}
.chart .bar.none{fill:var(--line)}
.chart .goal{stroke:var(--turmeric);stroke-width:1.6;stroke-dasharray:5 4}
.chart .val{fill:var(--ink-2);font-weight:600;font-size:10.5px}
.chart .xl.today{fill:var(--ink);font-weight:700}
.chart .line{fill:none;stroke:var(--leaf);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--leaf);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--leaf);stroke-width:2}
.chart .dot.last{fill:var(--leaf)}
.chart .lastlbl{fill:var(--ink);font-weight:700;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--k)}
.legend i.goal{height:0;width:16px;border-top:2px dashed var(--turmeric);border-radius:0;background:none}
.split{display:grid;gap:10px}
.split-row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.split-bar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.split-bar span{display:block;height:100%}
.split-bar .p{background:var(--protein)}.split-bar .c{background:var(--carbs)}.split-bar .f{background:var(--fat)}
.split-legend{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px}
.split-legend li{display:flex;align-items:center;gap:8px}
.split-legend i{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.split-legend .p{--k:var(--protein)}.split-legend .c{--k:var(--carbs)}.split-legend .f{--k:var(--fat)}
.split-legend b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.tip{margin-top:12px;background:var(--leaf-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.top-list{list-style:none;margin:0;padding:0;display:grid}
.top-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.top-list li:last-child{border-bottom:0}
.top-list .t-name{flex:1;min-width:0;font-weight:600}
.top-list .t-n{color:var(--ink-3);font-size:13px;white-space:nowrap}
.top-list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.wstats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.wstats div{display:grid}
.wstats div>span:first-child{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wstats .pill{justify-self:start;margin-top:2px}
.wstats b{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}

/* coach */
.coach{display:grid;gap:12px;max-width:760px;margin:0 auto}
.coach-msgs{display:grid;gap:10px;margin-top:6px}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.bub p+p,.bub p+ul,.bub ul+p{margin-top:8px}
.bub ul{margin:6px 0 0;padding-left:20px}
.bub li+li{margin-top:3px}
.bub.me{justify-self:end;background:var(--leaf);color:var(--leaf-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.bub.bot{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.bot .who{font-size:12px;font-weight:700;color:var(--leaf);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:2px}
.bub .note{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.coach-form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px}
.coach-form textarea{border:0;min-height:40px;max-height:160px;resize:none;padding:8px 8px;box-shadow:none!important;background:transparent}
.coach-form .iconbtn{width:44px;height:44px}
.coach-form .send{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}

/* profile */
.prof-grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:900px){.prof-grid{grid-template-columns:minmax(300px,400px) 1fr;align-items:start}.plan-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}}
.plan-card .big-kcal{font-size:54px;margin-top:4px}
.plan-card .macro-pills{margin:12px 0}
.prof-forms{display:grid;gap:14px}
.form-card h3{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:12px}
.reset-box{margin-top:12px;border:1.5px solid var(--chili-soft);border-radius:14px;padding:12px;display:grid;gap:10px}

.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);font-size:14.5px;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.toast-btn{background:none;border:0;color:var(--leaf-soft);font-weight:700;padding:4px 6px;min-height:32px;text-decoration:underline}
label.segbtn:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink)}
@media (min-width:900px){.toast{bottom:28px}}

/* sign-in */
#auth{z-index:58}
.auth{gap:16px;padding-top:calc(40px + env(safe-area-inset-top,0px))}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand svg{width:48px;height:48px}
.auth-brand .brand-name{font-size:30px}
.gbtn{width:100%;background:var(--surface);border-color:var(--line);min-height:50px;font-size:15.5px}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth .linkbtn{min-height:0;padding:2px 0;display:inline}
.auth-alt{font-size:14px;color:var(--ink-2)}
.ok-msg{font-size:13.5px;color:var(--leaf);font-weight:600}
.account{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.account b{overflow-wrap:anywhere}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <button class="brand" data-act="tab" data-tab="today" aria-label="NomNom Tracker, go to Today">
        <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--plate-rim)"/><circle cx="17" cy="17" r="13.4" fill="var(--plate)"/><circle cx="11" cy="12.6" r="4" fill="var(--carbs)"/><circle cx="19.6" cy="10.2" r="3.4" fill="var(--leaf)"/><circle cx="23.2" cy="17.8" r="3.6" fill="var(--chili)"/><ellipse cx="14.4" cy="21.6" rx="5.6" ry="3.6" fill="var(--plate-well)"/></svg>
        <span><span class="brand-name">NomNom</span><span class="brand-tag">Tracker</span></span>
      </button>
      <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
      <button class="btn primary sm head-add" data-act="add" data-meal="" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log food</button>
    </div>
  </header>
  <main class="wrap" id="main">
    <div class="loading" id="loading">
      <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--plate-rim)"/><circle cx="17" cy="17" r="13.4" fill="var(--plate)"/><circle cx="11" cy="12.6" r="4" fill="var(--carbs)"/><circle cx="19.6" cy="10.2" r="3.4" fill="var(--leaf)"/><circle cx="23.2" cy="17.8" r="3.6" fill="var(--chili)"/></svg>
      <p>Opening your food diary…</p>
    </div>
    <section id="v-today" class="view" hidden></section>
    <section id="v-insights" class="view" hidden></section>
    <section id="v-coach" class="view" hidden></section>
    <section id="v-profile" class="view" hidden></section>
  </main>
  <button class="fab" data-act="add" data-meal="" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log food</button>
</div>
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head" id="sheetHead"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div id="ob" class="ob-wrap" hidden role="dialog" aria-modal="true" aria-label="Set up your plan"></div>
<div id="auth" class="ob-wrap" hidden role="dialog" aria-modal="true" aria-label="Sign in"></div>
<noscript><p style="padding:24px">NomNom Tracker needs JavaScript turned on.</p></noscript>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import {FIREBASE_CONFIG, RECAPTCHA_SITE_KEY, RECAPTCHA_ENTERPRISE, GEMINI_MODEL, USDA_API_KEY} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {initializeAppCheck, ReCaptchaV3Provider, ReCaptchaEnterpriseProvider} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app-check.js';
import {getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteDoc, writeBatch, waitForPendingWrites} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
import {getAI, getGenerativeModel, GoogleAIBackend} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-ai.js';

/* ---------- food database: id|name|region|diet|serving|grams|kcal|protein|carbs|fat|fibre|other names ---------- */
const RAW = `
idli|Idli|S|v|1 piece|40|58|1.6|12|0.4|0.8|idly iddli இட்லி
rava-idli|Rava idli|S|v|1 piece|60|120|3|16|5|0.8|semolina idli
plain-dosa|Plain dosa|S|v|1 dosa|80|160|3.9|25|5|1|dosai dosey sada dosa dosai தோசை
masala-dosa|Masala dosa|S|v|1 dosa|200|340|7|48|13|3.5|masale dose மசாலா தோசை

/* ---------- model ---------- */
const profile = () => ({...DEFAULT_PROFILE, ...(S.docs.profile || {})});
const prefs = () => ({favs:[], recents:[], custom:[], ext:[], ...(S.docs.prefs || {})});
const weights = () => ((S.docs.weights && S.docs.weights.log) || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
const getDay = k => S.docs['day-' + k] || {date:k, entries:[], water:0, acts:[]};
function mutateDay(k, fn){ const d = clone(getDay(k)); d.entries = d.entries || []; d.acts = d.acts || []; fn(d); put('day-' + k, d); }
function mutatePrefs(fn){ const p = clone(prefs()); fn(p); put('prefs', p); }
const findFood = id => FOOD_BY_ID[id] || prefs().custom.find(c => c.id === id) || prefs().ext.find(c => c.id === id) || USDA.foods.get(id) || null;
function scale(b, qty, unit){ const k = unit === 'g' ? qty / (b.g || 100) : qty; return {kcal:b.kcal*k, p:b.p*k, c:b.c*k, f:b.f*k, fib:(b.fib || 0)*k}; }
const entryNut = e => scale(e.base, e.qty, e.unit);
function totals(d){ const t = {kcal:0,p:0,c:0,f:0,fib:0}; for (const e of d.entries || []){ const n = entryNut(e); t.kcal += n.kcal; t.p += n.p; t.c += n.c; t.f += n.f; t.fib += n.fib; } return t; }
const burnt = d => (d.acts || []).reduce((s, a) => s + (a.kcal || 0), 0);
function plan(p){
  const bmr = 10*p.weightKg + 6.25*p.heightCm - 5*p.age + (p.sex === 'm' ? 5 : -161);
  const act = ACTIVITY.find(a => a.id === p.activity) || ACTIVITY[1];
  const tdee = bmr * act.f;
  const pace = p.goal === 'maintain' ? 0 : p.pace;
  const adj = p.goal === 'lose' ? -pace*7700/7 : p.goal === 'gain' ? pace*7700/7 : 0;
  const floor = p.sex === 'm' ? 1500 : 1200;
  const floored = tdee + adj < floor;
  const target = Math.round(Math.max(tdee + adj, floor) / 10) * 10;
  const sp = SPLITS[p.split] || SPLITS.balanced;
  const bmi = p.weightKg / Math.pow(p.heightCm / 100, 2);
  const water = p.waterGoal || clamp(Math.round(p.weightKg * 0.035 / 0.25), 8, 14);
  const weeks = pace ? Math.abs(p.weightKg - p.targetWeightKg) / pace : 0;
  return {bmr, tdee, act, adj, pace, floor, floored, target, sp, bmi, water, weeks,
    pG:Math.round(target*sp.p/400), cG:Math.round(target*sp.c/400), fG:Math.round(target*sp.f/900), fib:Math.round(target/1000*14)};
}
function bmiBand(b){
  if (b < 18.5) return {name:'Underweight', cls:'warn'};
  if (b < 23) return {name:'Healthy', cls:'ok'};
  if (b < 25) return {name:'Overweight', cls:'warn'};
  return {name:'Obese range', cls:'bad'};
}
function dayStatus(k){
  const d = S.docs['day-' + k];
  if (!d || !(d.entries || []).length) return 'none';
  return totals(d).kcal > (plan(profile()).target + burnt(d)) * 1.05 ? 'over' : 'ok';
}
function mealNow(){ const n = new Date(), h = n.getHours() + n.getMinutes()/60; return h < 10.5 ? 'breakfast' : h < 12.5 ? 'msnack' : h < 15.5 ? 'lunch' : h < 19 ? 'esnack' : 'dinner'; }
const mealName = id => (MEALS.find(m => m.id === id) || MEALS[0]).name;
function dietOk(f, diet){ return diet === 'nonveg' || f.diet === 'v' || (diet === 'egg' && f.diet === 'e'); }
function suggestions(meal, p){
  const s = SUGGEST[meal], c = p.cuisine;
  let ids = c === 'tamil' ? s.T : c === 'south' ? s.S : c === 'north' ? s.N : s.S.flatMap((x, i) => [x, s.N[i]]).filter(Boolean);
  return [...new Set(ids)].map(id => FOOD_BY_ID[id]).filter(f => f && dietOk(f, p.diet));
}
function addEntry(k, meal, food, qty, unit){
  mutateDay(k, d => d.entries.push({id:uid(), fid:food.id, name:food.name, diet:food.diet, cat:food.cat, meal, qty, unit,
    base:{serving:food.serving, g:food.g, kcal:food.kcal, p:food.p, c:food.c, f:food.f, fib:food.fib || 0}, t:Date.now()}));
  if (food.cat !== 'AI') mutatePrefs(p => {
    p.recents = [food.id, ...p.recents.filter(x => x !== food.id)].slice(0, 30);
    if (food.cat === 'US') p.ext = [food, ...p.ext.filter(x => x.id !== food.id)].slice(0, 150);
  });
}
function logWeight(k, kg){
  const log = weights().filter(w => w.d !== k); log.push({d:k, kg:r1(kg)}); log.sort((a, b) => a.d < b.d ? -1 : 1);
  put('weights', {log:log.slice(-400)});
  if (log[log.length - 1].d === k) put('profile', {...profile(), weightKg:r1(kg)});
}

function aiErrorText(e){

function parseJSON(t){
  const s = String(t || '').trim();
  try { return JSON.parse(s); } catch {}
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) try { return JSON.parse(fence[1]); } catch {}
  const a = s.indexOf('['), b = s.lastIndexOf(']'); if (a >= 0 && b > a) try { return JSON.parse(s.slice(a, b + 1)); } catch {}
  throw {code:'invalid_json', message:'The answer came back garbled. Try again, or name the dishes more simply.'};
}
async function imageToBase64(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({code:'image', message:'That photo could not be read. Try a JPEG or PNG.'}); i.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

function normalizeAI(out){
  const arr = Array.isArray(out) ? out : (out && Array.isArray(out.items) ? out.items : []);
  const res = [];
  for (const it of arr.slice(0, 20)){
    if (!it || typeof it !== 'object') continue;
    let qty = Number(it.servings); if (!(qty > 0)) qty = 1;
    qty = clamp(Math.round(qty * 2) / 2 || 0.5, 0.5, 20);
    const f = it.id ? findFood(String(it.id)) : null;
    if (f){ res.push({on:true, food:f, qty, est:false}); continue; }
    const kcal = Number(it.kcal);
    if (!it.name || !(kcal >= 0)) continue;
    res.push({on:true, est:true, qty, food:{id:'ai-' + slug(it.name), name:String(it.name).slice(0, 60), cat:'AI',
      diet:['v','e','n'].includes(it.diet) ? it.diet : 'v', serving:String(it.serving || '1 serving').slice(0, 40),
      g:Number(it.grams) > 0 ? Number(it.grams) : 100, kcal, p:num(it.protein), c:num(it.carbs), f:num(it.fat), fib:num(it.fiber)}});
  }
  return res;
}

function thaliSVG(target, eaten, burn){

  const R = 94, C = 2 * Math.PI * R, left = Math.round(budget - eaten);
  const fill = Math.min(pct, 1) * C, extra = over ? Math.min(pct - 1, 1) * C : 0;
  return `<svg class="thali" viewBox="0 0 240 240" role="img" aria-label="${fmt(eaten)} of ${fmt(budget)} kilocalories eaten, ${fmt(Math.abs(left))} ${over ? 'over' : 'left'}">
    <circle class="plate-rim" cx="120" cy="120" r="118"/><circle class="plate" cx="120" cy="120" r="110"/>
    <circle class="ring-track" cx="120" cy="120" r="${R}"/>

    ${extra > 0 ? `<circle class="ring-over" cx="120" cy="120" r="${R}" stroke-dasharray="${extra.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 120 120)"/>` : ''}

  </svg>`;
}

function mealCard(m, d, pl, p){

function searchFoods(q, cat, vegOnly){
  const pr = prefs();

    else if (n.split(/[\s/()-]+/).some(w => w.startsWith(q))) s = 65;
    else if (terms.every(t => f.key.includes(t))) s = 40 + (n.includes(q) ? 10 : 0) + (f.key.split(/\s+/).some(w => w.startsWith(terms[0])) ? 5 : 0);
    return [s, f];

/* ---------- USDA FoodData Central: online search for foods not in the built-in list ---------- */
const USDA = {cache:new Map(), foods:new Map(), timer:null};
function usdaFood(f){
  const nut = (...ids) => { for (const id of ids){ const n = (f.foodNutrients || []).find(x => x.nutrientId === id); if (n && +n.value) return +n.value; } return 0; };
  const ms = (f.foodMeasures || []).filter(x => x.gramWeight > 0 && x.disseminationText && !/quantity not specified/i.test(x.disseminationText))
    .sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
  const m = ms.find(x => x.gramWeight >= 15 && x.gramWeight <= 500) || ms[0];
  const g = m ? m.gramWeight : 100, k = g / 100;
  let serving = m ? m.disseminationText.replace(/,?\s*NFS\b/gi, '').replace(/\s+/g, ' ').trim().slice(0, 40) : '100 g';
  if (!/^\d/.test(serving)) serving = '1 ' + serving;
  const name = String(f.description || '').replace(/,\s*(NFS|NS as to [^,]+)/gi, '').trim();
  return {id:'us-' + f.fdcId, name:name.charAt(0).toUpperCase() + name.slice(1), cat:'US', diet:'u', serving, g:r1(g),
    kcal:Math.round(nut(1008, 2047, 2048) * k), p:r1(nut(1003) * k), c:r1(nut(1005) * k), f:r1(nut(1004) * k), fib:r1(nut(1079) * k)};
}
function usdaSearch(q){
  clearTimeout(USDA.timer);
  const key = q.toLowerCase();
  if (USDA.cache.has(key)) return renderUsda(key);
  renderUsda(key, true);
  USDA.timer = setTimeout(async () => {
    try {
      const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(USDA_API_KEY)}&query=${encodeURIComponent(q)}`
        + `&dataType=${encodeURIComponent('Survey (FNDDS),SR Legacy,Foundation')}&pageSize=15`;
      const res = await fetch(url);
      if (!res.ok) throw {status:res.status};
      const j = await res.json(), seen = new Set(), items = [];
      for (const f of j.foods || []){
        const food = usdaFood(f), nk = food.name.toLowerCase();
        if (!food.kcal || seen.has(nk)) continue;
        seen.add(nk); USDA.foods.set(food.id, food); items.push(food);
      }
      USDA.cache.set(key, {items});
    } catch (e){
      const s = e && e.status;
      USDA.cache.set(key, {err:s === 429 ? "USDA's free demo key has hit its hourly limit. Add your own free key in config.js for more searches."
        : s === 401 || s === 403 ? 'The USDA key in config.js was refused. Check it, or set it back to DEMO_KEY.'
        : "Couldn't reach the USDA food database. Check your connection."});
      setTimeout(() => USDA.cache.delete(key), 60000);
    }
    renderUsda(key);
  }, 650);
}
function renderUsda(key, loading){
  const box = $('#usdaBox'); if (!box || SH.q.trim().toLowerCase() !== key) return;
  if (SH.vegOnly){ box.innerHTML = '<p class="fineprint">USDA results are hidden while Veg only is on, because they don\'t say whether a dish is vegetarian.</p>'; return; }
  const r = USDA.cache.get(key);
  if (loading || !r){ box.innerHTML = '<div class="status small"><span class="dots"><i></i><i></i><i></i></span> Searching the USDA food database…</div>'; return; }
  if (r.err){ box.innerHTML = `<p class="fineprint">${esc(r.err)}</p>`; return; }
  box.innerHTML = r.items.length ? `<p class="res-title">${r.items.length} more from the USDA database</p><ul class="results">${r.items.map(foodRow).join('')}</ul>`
    : '<p class="fineprint">No matches in the USDA database either.</p>';
}

function niceStep(v){ for (const s of [100,200,250,500,1000]) if (s >= v) return s; return 2000; }
function barChart(rows, target){
  const W = 360, H = 196, L = 38, R = 6, T = 18, B = 28;
  const max = Math.max(target * 1.15, ...rows.map(r => r.kcal)) * 1.05, step = niceStep(max / 4), yMax = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / yMax), bw = (W - L - R) / rows.length, barW = Math.min(30, bw * .58);
  const t = todayKey(); let g = '';
  for (let v = 0; v <= yMax; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  const bars = rows.map((r, i) => {
    const x = L + i * bw + (bw - barW) / 2, d = dateOf(r.k), cls = !r.logged ? 'none' : r.kcal > r.budget * 1.05 ? 'over' : 'ok';
    const h = r.logged ? Math.max(2, y(0) - y(r.kcal)) : 3;
    return `<rect class="bar ${cls}" x="${x.toFixed(1)}" y="${(y(0) - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4"><title>${dayLabel(r.k)}: ${r.logged ? fmt(r.kcal) + ' kcal' : 'nothing logged'}</title></rect>
      ${r.logged ? `<text class="val" x="${(x + barW / 2).toFixed(1)}" y="${(y(0) - h - 4).toFixed(1)}" text-anchor="middle">${fmt(r.kcal)}</text>` : ''}
      <text class="xl ${r.k === t ? 'today' : ''}" x="${(x + barW / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle">${r.k === t ? 'Today' : WD[d.getDay()]}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories eaten each day for the last 7 days against a ${fmt(target)} kcal goal">${g}${bars}
    <line class="goal" x1="${L}" x2="${W - R}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/></svg>`;
}
function lineChart(log, targetKg){
  const W = 360, H = 176, L = 36, R = 44, T = 16, B = 24, pts = log.slice(-40);
  const ts = pts.map(p => dateOf(p.d).getTime()), t0 = ts[0], t1 = ts[ts.length - 1], vals = pts.map(p => p.kg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const showT = targetKg && Math.abs(targetKg - (lo + hi) / 2) < 15;
  if (showT){ lo = Math.min(lo, targetKg); hi = Math.max(hi, targetKg); }
  lo -= 1; hi += 1;
  const span = hi - lo, step = span <= 6 ? 1 : span <= 12 ? 2 : span <= 30 ? 5 : 10;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = t => t1 === t0 ? (L + W - R) / 2 : L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(ts[i]).toFixed(1)} ${y(p.kg).toFixed(1)}`).join(' ');
  const area = pts.length > 1 ? `<path class="area" d="${line} L${x(t1).toFixed(1)} ${y(lo).toFixed(1)} L${x(t0).toFixed(1)} ${y(lo).toFixed(1)} Z"/>` : '';
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${shortDate(pts[0].d)} to ${shortDate(last.d)}">${g}
    ${showT ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${y(targetKg).toFixed(1)}" y2="${y(targetKg).toFixed(1)}"/><text x="${W - R + 4}" y="${(y(targetKg) + 3.5).toFixed(1)}">Goal</text>` : ''}
    ${area}<path class="line" d="${line}"/>
    ${pts.map((p, i) => `<circle class="dot ${i === pts.length - 1 ? 'last' : ''}" cx="${x(ts[i]).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"><title>${shortDate(p.d)}: ${fmt1(p.kg)} kg</title></circle>`).join('')}
    <text class="lastlbl" x="${Math.min(x(t1) + 7, W - 4).toFixed(1)}" y="${(y(last.kg) - 8).toFixed(1)}" text-anchor="${x(t1) > W - R - 10 ? 'end' : 'start'}">${fmt1(last.kg)} kg</text>
    <text x="${x(t0).toFixed(1)}" y="${H - 6}" text-anchor="${t1 === t0 ? 'middle' : 'start'}">${shortDate(pts[0].d)}</text>
    ${t1 !== t0 ? `<text x="${x(t1).toFixed(1)}" y="${H - 6}" text-anchor="end">${shortDate(last.d)}</text>` : ''}</svg>`;
}

function renderCoachMsgs(){
  const box = $('#coachMsgs'); if (!box) return;

  box.innerHTML = hello + CH.turns.map(t => t.role === 'user' ? `<div class="bub me">${esc(t.content)}</div>`
    : `<div class="bub bot"><span class="who">Coach</span>${t.pending ? '<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>' : mdLite(t.content)}${t.stopped ? '<p class="note">Stopped.</p>' : ''}</div>`).join('')
    + (CH.err ? `<p class="err" role="alert">${esc(CH.err)}</p>` : '');
  $('#coachChips').innerHTML = CH.turns.length ? `<button class="chip" data-act="coach-clear">${icon('close')} New chat</button>` : COACH_CHIPS.map(q => `<button class="chip" data-act="coach-chip" data-v="${esc(q)}">${esc(q)}</button>`).join('');
  $('#coachStop').hidden = !CH.busy; $('#coachSend').disabled = CH.busy;
}
async function coachSend(text){
  text = (text || '').trim(); if (!text || CH.busy || !aiOn()) return;
  CH.turns.push({role:'user', content:text});
  const bubble = {role:'assistant', content:'', pending:true}; CH.turns.push(bubble);
  CH.busy = true; CH.err = ''; renderCoachMsgs(); window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  const ctl = CH.ctl = new AbortController();
  const hist = CH.turns.slice(0, -1).filter(t => t.content).slice(-12).map(t => ({role:t.role, content:t.content}));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  const contents = [];
  for (const t of hist){
    const role = t.role === 'assistant' ? 'model' : 'user', last = contents[contents.length - 1];
    if (last && last.role === role) last.parts[0].text += '\n\n' + t.content; else contents.push({role, parts:[{text:t.content}]});
  }
  try {
    const {stream} = await gemini({systemInstruction:COACH_RULES + '\n\n' + coachContext()}).generateContentStream({contents}, {signal:ctl.signal});
    let txt = '';
    for await (const chunk of stream){
      let d = ''; try { d = chunk.text(); } catch {}
      if (d){ txt += d; bubble.content = txt; bubble.pending = false; renderCoachMsgs(); }
    }
    if (!txt) throw {message:'Gemini sent back an empty answer.'};
    bubble.pending = false;
  } catch (e){
    bubble.pending = false;
    if (isAbort(e)) bubble.stopped = !!bubble.content; else CH.err = aiErrorText(e);
    if (!bubble.content) CH.turns.pop();
  } finally {
    CH.busy = false; CH.ctl = null; renderCoachMsgs();
  }
}

    case 'sheet-close': closeSheet(); break;
    case 'sheet-back': sheetBack(); break;
    case 'stab': SH.tab = ds.tab; SH.mode = 'browse'; renderSheet(); if (ds.tab === 'search') setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 0); break;
    case 'cat': SH.cat = ds.cat; renderSheet(); break;
    case 'pick': openDetail(findFood(ds.fid), SH.meal, true); break;
    case 'dq': { const st = D.unit === 'g' ? 10 : 0.5; D.qty = Math.max(0, Math.round((D.qty + st * +ds.n) / st) * st); if (D.unit === 'srv' && D.qty === 0 && +ds.n < 0) D.qty = 0.5; renderSheet(); break; }
    case 'dqset': D.qty = +ds.v; renderSheet(); break;
    case 'dmeal': D.meal = ds.v; renderSheet(); break;
    case 'd-save': saveDetail(); break;
    case 'del-entry': removeEntry(D.editId); break;
    case 'fav': { const f = D.food, id = f.id; mutatePrefs(p => {
      p.favs = p.favs.includes(id) ? p.favs.filter(x => x !== id) : [id, ...p.favs].slice(0, 100);
      if (f.cat === 'US' && !p.ext.some(x => x.id === id)) p.ext = [f, ...p.ext].slice(0, 150);
    }); renderSheet(); break; }
    case 'ask-ai': SH.ai.text = SH.q.trim(); SH.ai.error = ''; SH.tab = 'describe'; renderSheet(); runAI(); break;
    case 'del-custom': { const id = D.food.id; mutatePrefs(p => { p.custom = p.custom.filter(c => c.id !== id); p.favs = p.favs.filter(x => x !== id); p.recents = p.recents.filter(x => x !== id); });
      SH.tab = 'mine'; SH.mode = 'browse'; renderSheet(); toast('Food deleted'); break; }
    case 'new-food': SH.mode = 'custom'; renderSheet(); setTimeout(() => { const n = $('#cf-name'); if (n) n.focus(); }, 30); break;
    case 'ai-run': runAI(); break;
    case 'ai-stop': if (SH.ai.ctl) SH.ai.ctl.abort(); break;
    case 'ai-photo': { const f = $('#aiFile'); if (f) f.click(); break; }
    case 'ai-clear-photo': if (SH.ai.imageURL) URL.revokeObjectURL(SH.ai.imageURL); SH.ai.image = null; SH.ai.imageURL = ''; renderSheet(); break;
    case 'rv-toggle': SH.review.items[+ds.n].on = a.checked; renderSheet(); break;
    case 'rv-q': { const it = SH.review.items[+ds.n]; it.qty = clamp(it.qty + 0.5 * +ds.v, 0.5, 20); renderSheet(); break; }
    case 'rv-meal': SH.review.meal = ds.v; renderSheet(); break;
    case 'rv-add': { const on = SH.review.items.filter(i => i.on); for (const it of on) addEntry(UI.date, SH.review.meal, it.food, it.qty, 'srv');
      SH.ai.text = ''; if (SH.ai.imageURL) URL.revokeObjectURL(SH.ai.imageURL); SH.ai.image = null; SH.ai.imageURL = '';
      toast(`Added ${on.length} ${on.length === 1 ? 'item' : 'items'} to ${mealName(SH.review.meal).toLowerCase()}`); closeSheet(); render(); break; }
    case 'am-set': SH.act.mins = +ds.v; renderSheet(); break;
    case 'act-add': { const ex = EXERCISES.find(x => x.id === SH.act.type), kcal = actKcal();
      if (!(kcal > 0)) { toast(ex.steps ? 'Enter how many steps you walked.' : 'Enter how many minutes you were active.'); break; }
      mutateDay(UI.date, d => d.acts.push({id:uid(), type:ex.id, name:ex.name, mins:ex.steps ? 0 : SH.act.mins, steps:ex.steps ? SH.act.steps : 0, kcal}));
      toast(`${ex.name}: ${fmt(kcal)} kcal added to your budget`); closeSheet(); render(); break; }
    case 'ob-next': { const er = obValidate(); OB.err = er; if (!er) OB.step++; renderOB(); $('#ob').scrollTop = 0; break; }
    case 'ob-back': OB.err = ''; OB.step = Math.max(0, OB.step - 1); renderOB(); break;
    case 'ob-set': obSet(ds.k, ds.v); break;
    case 'ob-hunit': OB.hunit = ds.v; renderOB(); break;
    case 'ob-skip': if (!OB.fromProfile && !S.docs.profile) put('profile', {...DEFAULT_PROFILE}); OB.dismissed = true; closeOB(); render(); break;
    case 'ob-finish': obFinish(); break;
    case 'coach-chip': coachSend(ds.v); break;
    case 'coach-stop': if (CH.ctl) CH.ctl.abort(); break;
    case 'coach-clear': CH.turns = []; CH.err = ''; renderCoachMsgs(); break;
    case 'reset-ask': { const b = $('#resetBox'); b.hidden = false;
      b.innerHTML = `<div class="reset-box"><p><b>Erase everything?</b> This deletes your diary, weight log, saved foods and plan ${S.mode === 'cloud' ? 'from your account on every device' : 'from this browser'}. It can't be undone.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger sm" data-act="reset-do">Erase everything</button><button class="btn ghost sm" data-act="reset-cancel">Keep my data</button></div></div>`;
      b.querySelector('[data-act="reset-cancel"]').focus(); break; }
    case 'reset-cancel': $('#resetBox').hidden = true; break;
    case 'reset-do': resetAll(); break;
    case 'sign-out': signOutNow().catch(e => toast('Sign-out failed: ' + e.message)); break;
    case 'sign-in': showAuth(); break;
    case 'au-google': authRun(() => signInWithPopup(auth, new GoogleAuthProvider())); break;
    case 'au-mode': { const em = $('#au-email'); if (em) AU.email = em.value.trim(); AU.mode = ds.v; renderAuth(); const f = $(AU.email ? '#au-pass' : '#au-email'); if (f) f.focus(); break; }
    case 'au-reset': { const email = $('#au-email').value.trim(); AU.email = email;
      if (!email){ authMsg('Enter your email above, then tap Forgot password again.', true); break; }
      authRun(async () => { await sendPasswordResetEmail(auth, email); authMsg(`If ${email} has an account, a reset link is on its way. Check spam too.`); }); break; }
    case 'au-local': startLocal(); break;
    case 'toast-undo': if (TOAST_UNDO){ const f = TOAST_UNDO; TOAST_UNDO = null; $('#toast').hidden = true; f(); } break;
  }
});
function n0(cur){ return Math.max(0, cur - 1); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ SH.q = t.value; renderResults(); }
  else if (t.id === 'dq'){ SH.detail.qty = Math.max(0, parseFloat(t.value) || 0); $('#dNut').innerHTML = detailNutHTML(); const b = $('#dSave'); if (b) b.disabled = !(SH.detail.qty > 0); }
  else if (t.id === 'aiText') SH.ai.text = t.value;
  else if (t.dataset.ob) obInput(t);
  else if (t.id === 'am' || t.id === 'as'){ if (t.id === 'am') SH.act.mins = clamp(parseFloat(t.value) || 0, 0, 600); else SH.act.steps = clamp(parseFloat(t.value) || 0, 0, 100000); $('#aPrev').innerHTML = actPrevHTML(); }
  else if (t.id === 'coachIn'){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
  else if (t.dataset.pf === 'name') profileChange(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'du'){ const D = SH.detail, to = t.value; if (to !== D.unit){ D.qty = to === 'g' ? Math.round(D.qty * D.food.g) : Math.max(0.5, Math.round(D.qty / D.food.g * 2) / 2); D.unit = to; } renderSheet(); }
  else if (t.id === 'vegOnly'){ SH.vegOnly = t.checked; renderResults(); }
  else if (t.id === 'at'){ SH.act.type = t.value; renderSheet(); }
  else if (t.id === 'aiFile' && t.files && t.files[0]){ if (SH.ai.imageURL) URL.revokeObjectURL(SH.ai.imageURL); SH.ai.image = t.files[0]; SH.ai.imageURL = URL.createObjectURL(t.files[0]); SH.ai.error = ''; renderSheet(); }
  else if (t.dataset.pf && t.dataset.pf !== 'name') profileChange(t);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'coachForm'){ const i = $('#coachIn'); const v = i.value; i.value = ''; i.style.height = 'auto'; coachSend(v); }
  else if (f.id === 'customForm') saveCustom();
  else if (f.id === 'authForm') authSubmit();
  else if (f.id === 'weightForm'){
    const kg = parseFloat($('#wk').value), err = $('#wk-err');
    if (!(kg >= 30 && kg <= 250)){ err.textContent = 'Enter a weight from 30 to 250 kg.'; err.hidden = false; return; }
    logWeight(UI.date, kg); toast(`Weight saved: ${fmt1(kg)} kg`); closeSheet(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && SH.open){ closeSheet(); return; }
  if (e.target.id === 'coachIn' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#coachForm').requestSubmit(); }
  if (e.target.id === 'q' && e.key === 'Enter'){ const first = $('#results .food-row'); if (first){ e.preventDefault(); first.click(); } }
  if (e.key === 'Tab' && SH.open){
    const f = [...$('#sheetPanel').querySelectorAll('button:not([disabled]),input:not([type=hidden]):not([hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  }
});
setInterval(() => { const t = todayKey(); if (UI.lastToday && UI.lastToday !== t && UI.date === UI.lastToday){ UI.date = t; if (UI.view === 'today') renderToday(); } UI.lastToday = t; }, 60000);
UI.lastToday = todayKey();

onAuthStateChanged(auth, user => {
  if (user) startCloud(user);
  else if ((() => { try { return localStorage.getItem(LOCAL_FLAG) === '1'; } catch { return false; } })()) startLocal();
  else showAuth();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
